openapi: 3.0.0
info:
  title: demo-slap Public API
  version: 1.0.0
  description: "Welcome to the demo-slap Public API! For access and support, please join our Discord community: [https://discord.gg/8nfh26W9wQ](https://discord.gg/8nfh26W9wQ)"
servers:
  - url: https://api.demo-slap.net

paths:
  /public-api/matches:
    get:
      tags:
        - Match
      summary: Get user matches
      description: Retrieve a paginated list of matches for the authenticated user.
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination.
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 10
          description: Number of matches per page.
      responses:
        '200':
          description: A paginated list of user matches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMatchResponse'
        '401':
          description: API key missing or invalid
  /public-api/credits-calc:
    post:
      tags:
        - Calculate
      summary: Calculate credit costs for a render
      description: Calculate how many credits a render job would cost.
      security:
        - ApiKeyAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditsCalcRequest'
      responses:
        '200':
          description: Credit cost
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditsCalcResponse'
        '401':
          description: API key missing or invalid
  /public-api/analyze/url:
    post:
      tags:
        - Analyze
      summary: Queue analysis for a demo
      description: Starts analysis for a demo provided by URL.
      security:
        - ApiKeyAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
      responses:
        '200':
          description: Analysis job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeJobResponse'
        '401':
          description: API key missing or invalid
  /public-api/analyze/{jobId}/status:
    get:
      tags:
        - Analyze
      summary: Get analyze job status
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
          description: Analyze job identifier from `/analyze/url`
      responses:
        '200':
          description: Analyze job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeJobStatusResponse'
        '401':
          description: API key missing or invalid
        '404':
          description: Analyze job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /public-api/analyze/{jobId}/data:
    get:
      tags:
        - Analyze
      summary: Get analyze results (highlights metadata)
      description: Returns structured highlight metadata when status is `done`.
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
          description: Analyze job identifier from `/analyze/url`
      responses:
        '200':
          description: Analyze results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeDataResponse'
        '409':
          description: Analysis not complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: API key missing or invalid
        '404':
          description: Analyze job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /public-api/render/{jobId}:
    post:
      tags:
        - Render
      summary: Queue a render job from analyzed highlights
      description: Provide highlight IDs from analyze results to render clips.
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
          description: Analyze job identifier from `/analyze/url`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderUploadRequest'
      responses:
        '200':
          description: Render job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderJobResponse'
        '400':
          description: Validation error (invalid highlight IDs or missing jobId)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: API key missing or invalid
        '404':
          description: Analyze data not found for given jobId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /public-api/render/{jobId}/status:
    get:
      tags:
        - Render
      summary: Get render job status
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
          description: Analyze job identifier from `/analyze/url`
      responses:
        '200':
          description: Render job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderJobStatusResponse'
        '401':
          description: API key missing or invalid
        '404':
          description: Render job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /public-api/render/{jobId}/data:
    get:
      tags:
        - Render
      summary: Get rendered clip URLs
      description: Returns clip URLs after the render job is done.
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
          description: Analyze job identifier from `/analyze/url`
      responses:
        '200':
          description: Rendered clips
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderDataResponse'
        '409':
          description: Render not complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: API key missing or invalid
        '404':
          description: Render job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /public-api/render-fragmovie/{jobId}:
    post:
      tags:
        - Fragmovie
      summary: Stitch already-rendered clips into a fragmovie
      description: |
        Stitches a set of already-rendered video clips into a single
        fragmovie MP4.

        **Prerequisite pipeline:**
          1. `POST /public-api/analyze/url` → analyze jobId
          2. `POST /public-api/render/{jobId}` → array of video jobIds
          3. Wait until every video jobId is `done` via
             `/public-api/render/{jobId}/status`
          4. Pass those video jobIds as `highlightIds` to **this**
             endpoint. The path `{jobId}` is the analyze jobId from step 1.

        See `RenderFragMovieRequest.highlightIds` for the full warning
        about which ids belong here — analyze highlight ids and unfinished
        clips will be rejected with 400 before credits are deducted.
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
          description: Analyze job identifier from `/analyze/url`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderFragMovieRequest'
      responses:
        '200':
          description: Fragmovie render job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeJobResponse'
        '400':
          description: |
            Validation error. Common causes:
              * `highlightIds` empty or missing
              * none of the supplied `highlightIds` resolve to a
                rendered FragMovie clip belonging to the user (e.g. the
                caller passed analyze highlight ids instead of video
                jobIds, or the underlying renders are still in progress).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: API key missing or invalid
        '404':
          description: Analyze data not found for given jobId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /public-api/render-fragmovie/{jobId}/status:
    get:
      tags:
        - Fragmovie
      summary: Get fragmovie render job status
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
          description: Fragmovie render job identifier from `/render-fragmovie`
      responses:
        '200':
          description: Fragmovie render job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeJobStatusResponse'
        '401':
          description: API key missing or invalid
        '404':
          description: Render job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /public-api/render-fragmovie/{jobId}/data:
    get:
      tags:
        - Fragmovie
      summary: Get rendered fragmovie URL
      description: Returns fragmovie URL after the render job is done.
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
          description: Fragmovie render job identifier from `/render-fragmovie`
      responses:
        '200':
          description: Rendered fragmovie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderDataResponse'
        '409':
          description: Render not complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: API key missing or invalid
        '404':
          description: Render job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    PaginatedMatchResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MatchResponse'
        meta:
          type: object
          properties:
            page:
              type: integer
            pageSize:
              type: integer
            pageCount:
              type: integer
            rowCount:
              type: integer
    MatchResponse:
      type: object
      properties:
        jobId:
          type: string
        source:
          type: string
          enum: [url, api, rungame-url, upload, match-token, faceit]
        status:
          type: string
          enum: [Uploading, Added, ReadyForAnalyzing, Analyzing, Analyzed, Error]
        matchTime:
          type: string
          format: date-time
        map:
          type: string
        teamA:
          $ref: '#/components/schemas/Team'
        teamB:
          $ref: '#/components/schemas/Team'
        hasVideos:
          type: boolean
    Team:
      type: object
      properties:
        score:
          type: integer
          description: Final score of this team in the match.
          example: 13
        players:
          type: array
          items:
            $ref: '#/components/schemas/Player'
    Player:
      type: object
      properties:
        steamId:
          type: string
        name:
          type: string
        isMe:
          type: boolean
          description: True when this player is the authenticated user (matched by steamId).
          example: false
    AnalyzeJobStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ working, done, error ]
        errorMessage:
          type: string
          nullable: true
      example:
        status: working
    AnalyzeJobResponse:
      type: object
      properties:
        jobId:
          type: string
          description: Identifier for the analyze job
          example: "12345"
    Kill:
      type: object
      properties:
        weapon:
          type: string
          description: Weapon used for the kill
          example: "AK-47"
        victim:
          type: string
          description: SteamID of the victim
          example: "76561198022222222"
        victimIsMe:
          type: boolean
          description: True when the victim is the authenticated user.
          example: false
        ttd:
          type: integer
          description: Time to first damage in milliseconds
          example: 50
          nullable: true
        ttk:
          type: integer
          description: Time to kill in milliseconds
          example: 450
          nullable: true
    Highlight:
      type: object
      properties:
        id:
          type: string
          description: Highlight identifier
          example: "1"
        steamId:
          type: string
          description: SteamID of the player who got the kills (the highlight's killer).
          example: "76561198000000000"
        isMe:
          type: boolean
          description: True when the killer (steamId above) is the authenticated user. Use this to filter the user's own plays before rendering.
          example: true
        killCount:
          type: integer
          description: Number of kills in the clip
          example: 3
        roundNumber:
          type: integer
          description: Round number within the match
          example: 14
        tags:
          type: array
          items:
            type: string
          description: Tags associated with the highlight
          example: [ "3k", "clutch" ]
        kills:
          type: array
          items:
            $ref: '#/components/schemas/Kill'
    AnalyzeDataResponse:
      type: object
      properties:
        highlights:
          type: array
          items:
            $ref: '#/components/schemas/Highlight'
      example:
        highlights:
          - id: "1"
            steamId: "76561198000000000"
            isMe: true
            killCount: 2
            roundNumber: 3
            tags: [ "2k" ]
            kills:
              - weapon: "AK-47"
                victim: "76561198022222222"
                victimIsMe: false
                ttd: 300
                ttk: 600
              - weapon: "Deagle"
                victim: "76561198033333333"
                victimIsMe: false
          - id: "2"
            steamId: "76561198011111111"
            isMe: false
            killCount: 4
            roundNumber: 11
            tags: [ "4k", "clutch" ]
            kills:
              - weapon: "AWP"
                victim: "76561198044444444"
                victimIsMe: false
              - weapon: "AWP"
                victim: "76561198055555555"
                victimIsMe: false
              - weapon: "AWP"
                victim: "76561198066666666"
                victimIsMe: false
              - weapon: "AWP"
                victim: "76561198077777777"
                victimIsMe: false

    RenderUploadRequest:
      allOf:
        - $ref: '#/components/schemas/RenderOptions'
        - type: object
          required:
            - highlightIds
          properties:
            highlightIds:
              type: array
              description: IDs from AnalyzeDataResponse.highlights[].id
              items:
                type: string
              example: [ "1", "2", "5" ]


    RenderFragMovieRequest:
      type: object
      required:
        - highlightIds
        - introTitle
      properties:
        highlightIds:
          type: array
          description: |
            **Video jobIds** from a previously-completed `/public-api/render/{jobId}`
            call (the strings in `RenderJobResponse.jobIds`, also the keys
            returned by `/public-api/render/{jobId}/status`).

            ⚠️ Despite the field name, these are NOT the
            `AnalyzeDataResponse.highlights[].id` values. The fragmovie
            stitcher operates on already-rendered clip videos, so each
            id you pass must:
              1. belong to the authenticated user, and
              2. be a clip video whose render status is `done`.

            Supplying analyze highlight ids (or videoIds whose render
            isn't finished yet) returns `400 No rendered clips found for
            the supplied highlightIds.` before any credits are charged.

            The field is named `highlightIds` for backwards compatibility.
          items:
            type: string
          example: [ "65f0a1b2c3d4e5f600000123", "65f0a1b2c3d4e5f600000124" ]
        introTitle:
          type: string
          description: Displayed Intro Title
          example: Katowice '25

    RenderJobResponse:
      type: object
      properties:
        jobIds:
          type: array
          description: JobIds of each video, use the `jobId` from `/render/{jobId}` (which is the analyze job ID) to query status in /render/{jobId}/status
          items:
            type: string
          example: [ "123", "1234", "12345" ]

    RenderJobStatusResponse:
      type: object
      additionalProperties:
        type: object
        properties:
          status:
            type: string
            enum: [ working, done, error ]
            description: Current status of the video render job
          estimatedFinishAt:
            type: string
            format: date-time
            description: Estimated finish time for the video render job
            example: "2025-11-20T12:00:00Z"
        required:
          - status
      example:
        "1234":
          status: done
          estimatedFinishAt: "2025-11-20T12:00:00Z"
        "5678":
          status: working
          estimatedFinishAt: "2025-11-20T12:00:00Z"

    RenderDataResponse:
      type: object
      properties:
        highlightClips:
          type: object
          additionalProperties:
            type: object
            properties:
              clipUrl:
                type: string
                format: uri
                example: https://cdn.example.com/renders/uuid/clip-1.mp4
              clipLengthSeconds:
                type: number
                format: float
                example: 15.32
      example:
        highlightClips:
          "1":
            clipUrl: https://cdn.example.com/renders/123/clip-1.mp4
            clipLengthSeconds: 15.32
          "2":
            clipUrl: https://cdn.example.com/renders/123/clip-2.mp4
            clipLengthSeconds: 20.10
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Not enough credits
    CreditsCalcRequest:
      allOf:
        - $ref: '#/components/schemas/RenderOptions'
        - type: object
          required:
            - sceneAmount
          properties:
            sceneAmount:
              type: integer
              description: "Number of scenes to render"
              example: 5
    CreditsCalcResponse:
      type: object
      properties:
        credits:
          type: integer
          example: 10
    RenderOptions:
      type: object
      properties:
        hideUi:
          type: boolean
          description: Hide all UI elements
          default: false
        showXRay:
          type: boolean
          description: Show player outlines through walls
          default: false
        showTracers:
          type: boolean
          description: Show bullet tracers
          default: false
        hideKillfeed:
          type: boolean
          description: Hide the killfeed
          default: false
        hideWatermark:
          type: boolean
          description: Hide the demo-slap watermark
          default: false
        tickPresetInSeconds:
          type: integer
          description: Seconds to record before the kill happens
          default: 7
          minimum: 5
          maximum: 15
